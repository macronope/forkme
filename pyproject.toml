[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idiom-test"
version = "0.1.0"
description = "Idiomatic, dependency-free array transformation helpers for Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["array", "list", "iterable", "functional", "transform", "utilities"]
authors = [{ name = "Wholelottatesting" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/wholelottatesting/idiom-test"
Repository = "https://github.com/wholelottatesting/idiom-test"
Issues = "https://github.com/wholelottatesting/idiom-test/issues"

[tool.hatch.build.targets.wheel]
packages = ["idiom_test"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "idiom_test"]
